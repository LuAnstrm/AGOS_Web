[project]
name = "agos-ml"
version = "0.1.0"
description = "AGOS inference service: flood-risk classification (Random Forest) and water-level forecasting (LSTM)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "numpy>=2.1",
  "scikit-learn>=1.6",
  "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
